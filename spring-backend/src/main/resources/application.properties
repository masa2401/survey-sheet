# サーバー設定
server.port=${PORT:8080}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# データベース設定
# Railway環境変数（SPRING_DATASOURCE_URL等）があればそれを使い、なければローカルDockerの「db」コンテナに接続する
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/myapp_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres_password}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA/Hibernate設定
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# SQLログ出力。既定は false（本番）で、ローカルは docker-compose.yml の環境変数で true にする
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.auto_quote_keyword=true

# 定義ファイル（survey.json・display.json）を置いたフォルダ。未設定なら起動を止める
survey.dir=${SURVEY_DIR:}

# 名前の文字数の上限（1〜100）
sheet.user-name-max-length=${USER_NAME_MAX_LENGTH:20}

# シートの保存期間（日数）
# S3 バケット skillsheet-pdf-masa2401 のライフサイクルルール（AWS コンソールで設定）と同じ値にする。
# 変更する時は両方を変更すること。PDF だけが先に消えると、保存済み ID での再訪時に PDF を取得できない。
sheet.expiry.days=5

# シート新規作成（POST /api/sheets）のスロットリング設定
# 同一クライアント（IPアドレス単位）が window-seconds 秒間に max-requests 回を超えて
# シート作成（＝Lambda PDF生成の無条件実行）を行った場合、429を返す
sheet.save.rate-limit.max-requests=20
sheet.save.rate-limit.window-seconds=600

# AWS PDF生成連携
aws.region=ap-northeast-1
aws.lambda.pdf-function-name=skillsheet-pdf-generator
aws.s3.pdf-bucket-name=skillsheet-pdf-masa2401
app.frontend-base-url=${FRONTEND_BASE_URL:https://full-stack-create-skill-sheet.vercel.app}